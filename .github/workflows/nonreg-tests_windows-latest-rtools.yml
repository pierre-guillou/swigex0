name: nonreg-tests_windows-latest-rtools

on:
  # Permit calling trigger
  workflow_call:
  # Activate the workflow at each push on main branch
  #push:
  #  branches: [ main ]
  # Activate the workflow at each pull request on main branch
  #pull_request:
  #  branches: [ main ]
  # Permit manual trigger
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Manual'
        required: false
        default: ''

env:
  # Customize the CMake build type here (Release, Debug)
  CMAKE_BUILD_TYPE : Release
  BUILD_DIR : build
  CMAKE_GENERATOR : "MSYS Makefiles"
  R_VERSION : "4.6.0"
  SWIG_ROOT : ${{github.workspace}}\swig

jobs:

  build:
    runs-on: windows-2025-vs2026

    steps:
    - uses: actions/checkout@v4

    - name: Create a folder for compiling SWIG and installing dependencies
      shell: powershell
      run: |
        mkdir swig_src

    - name: Install SWIG dependencies
      # See nuget.yml in SWIG github repo
      shell: powershell
      run: |
        cd swig_src
        nuget install Bison -Version 3.7.4 -OutputDirectory .\bison
        nuget install PCRE2 -Version 10.47.0 -OutputDirectory .\pcre2

    - name: Compile and install [customized] SWIG
      shell: powershell
      run: |
        cd swig_src
        git clone https://github.com/fabien-ors/swig
        cd swig
        $env:PATH="..\bison\Bison.3.7.4\bin;" + $env:PATH
        $PCRE2_PATH="..\pcre2\PCRE2.10.47.0"
        cmake -Bbuild -G"Visual Studio 18 2026" -DCMAKE_INSTALL_PREFIX:PATH=${{env.SWIG_ROOT}} -DPCRE2_ROOT="$PCRE2_PATH" -DPCRE2_USE_STATIC_LIBS=ON
        cmake --build build --config Release
        cmake --install build --config Release

    - name: Setup R Version
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{env.R_VERSION}}

    - name: Configure build directory
      run: |
        cmake `
          -B${{ env.BUILD_DIR }} `
          -DBUILD_R=ON `
          -DBUILD_PYTHON=OFF `
          -DSWIG_EXECUTABLE=${{env.SWIG_ROOT}}/bin/swig

    - name: Build the package
      run: |
        cmake --build ${{env.BUILD_DIR}} --parallel 3

    - name: Install packages and execute non-regression tests
      run: |
        cmake --build ${{env.BUILD_DIR}} --parallel 3 --target check

    - name: Compress output logs
      if: success() || failure()
      shell: powershell
      run: |
        cd ${{env.BUILD_DIR}}/tests
        Get-ChildItem -Recurse -Filter '*.out' | Select-Object -ExpandProperty Fullname | Resolve-Path -Relative > logs.txt
        foreach ($filename in Get-Content .\logs.txt)
        {
            Compress-Archive -Update $filename .\rtools-logs.zip
        }

    - name: Publish output logs as artefact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: rtools-nonreg-logs
        path: ${{env.BUILD_DIR}}/tests/rtools-logs.zip
